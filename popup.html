<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF--8">
    <title>Typeracer Helper Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1e1e1e;
            --surface-color: #2d2d2d;
            --primary-color: #00e676;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #424242;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            width: 320px;
            padding: 16px;
            margin: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .header img {
            width: 32px;
            height: 32px;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .setting-row {
            margin-bottom: 18px;
        }

        .setting-row label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .setting-row input[type="number"],
        .setting-row input[type="text"] {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            padding: 8px;
            width: 70px;
            text-align: center;
            font-size: 14px;
        }

        input[type="text"]#ocrApiKey {
            width: 95%;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary-color);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #save {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        #save:hover {
            opacity: 0.9;
        }

        #reset {
            background-color: var(--surface-color);
            color: var(--text-secondary);
        }

        #reset:hover {
            background-color: var(--border-color);
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
            height: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="icons/Blog.png" alt="icon">
        <h2>Helper Settings</h2>
    </div>

    <div class="setting-row">
        <label for="speed">
            <span>Typing Delay (ms)</span>
            <input type="number" id="speed" min="10" max="200">
        </label>
        <input type="range" id="speedSlider" min="10" max="200">
    </div>


    <div class="setting-row">
        <label for="errorRate">
            <span>Error Rate (%)</span>
            <input type="number" id="errorRate" min="0" max="100">
        </label>
        <input type="range" id="errorRateSlider" min="0" max="100">
    </div>

    <div class="setting-row">
        <label>
            <span>Auto-Submit OCR</span>
            <label class="toggle-switch">
                <input type="checkbox" id="autoSubmit">
                <span class="slider"></span>
            </label>
        </label>
    </div>

    <div class="setting-row">
        <label for="ocrApiKey">OCR API Key</label>
        <input type="text" id="ocrApiKey" placeholder="Your ocr.space API key">
    </div>

    <div class="button-group">
        <button id="reset">Reset</button>
        <button id="save">Save Settings</button>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>

</html>
